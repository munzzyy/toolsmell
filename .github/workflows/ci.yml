name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package (no runtime dependencies)
        run: pip install -e .

      - name: Install pytest
        run: pip install pytest

      - name: Run tests with unittest (zero deps beyond the package itself)
        run: python -m unittest discover -s tests -t . -v

      - name: Run tests with pytest
        run: pytest -v

      - name: Smoke-test the CLI end to end
        run: |
          toolsmell --list-rules
          toolsmell examples/weather-tool-clean.json --max-score 50
          toolsmell examples/weather-tool-smelly.json --json --max-score 1000
